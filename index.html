<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tameru" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tameru</title>
    <style>
      /* Paints before any script or stylesheet. Matches --bg so there's no flash. */
      html { background: #ffffff; color: #111111; }
      @media (prefers-color-scheme: dark) { html { background: #0c0c0c; color: #f2f2f2; } }
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: inherit; transition: opacity 0.2s ease-out; }
      #splash.splash--out { opacity: 0; pointer-events: none; }
      /* Shown only if loading takes a moment: no fake wait on a fast start. */
      #splash svg { width: 64px; height: 64px; opacity: 0; animation: splash-in 0.25s ease-out 0.4s forwards; }
      #splash path { fill: none; stroke-width: 5; stroke-linecap: round; }
      #splash .track { stroke: currentColor; opacity: 0.18; }
      #splash .t { stroke: currentColor; stroke-linejoin: round; }
      /* The gauge fills and empties while loading. */
      #splash .fill { stroke: #c9d86a; stroke-dasharray: 104 200; animation: splash-gauge 1.6s ease-in-out infinite; }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-gauge { 0% { stroke-dashoffset: 104; } 55% { stroke-dashoffset: 30; } 100% { stroke-dashoffset: 104; } }
      @media (prefers-reduced-motion: reduce) { #splash .fill { animation: none; stroke-dashoffset: 30; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="6 6 52 52">
        <g transform="translate(0 3)">
          <path class="track" d="M16.44 47.56A22 22 0 1 1 47.56 47.56" />
          <path class="fill" d="M16.44 47.56A22 22 0 1 1 47.56 47.56" />
          <path class="t" d="M30.75 19.5V35a5 5 0 0 0 5 5H38M24.75 26.5H38" />
        </g>
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
