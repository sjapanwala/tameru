<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tameru" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tameru</title>
    <style>
      /* Paints before any script or stylesheet. Matches --bg so there's no flash. */
      html { background: #ffffff; color: #111111; }
      @media (prefers-color-scheme: dark) { html { background: #0c0c0c; color: #f2f2f2; } }
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: inherit; transition: opacity 0.2s ease-out; }
      #splash.splash--out { opacity: 0; pointer-events: none; }
      /* Shown only if loading takes a moment: no fake wait on a fast start. */
      #splash svg { width: 56px; height: 56px; opacity: 0; animation: splash-in 0.25s ease-out 0.4s forwards; }
      #splash path { stroke: currentColor; stroke-width: 6; fill: none; opacity: 0.2; animation: splash-sweep 1.4s ease-in-out infinite; }
      #splash path:nth-child(2) { animation-delay: 0.1s; }
      #splash path:nth-child(3) { animation-delay: 0.2s; }
      #splash path:nth-child(4) { animation-delay: 0.3s; }
      #splash path:nth-child(5) { animation-delay: 0.4s; }
      #splash path:nth-child(6) { animation-delay: 0.5s; }
      #splash path:nth-child(7) { animation-delay: 0.6s; }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-sweep { 0%, 100% { opacity: 0.2; } 30% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash path { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="8 12 48 40">
        <path d="M14.68 47.00A20 20 0 0 1 12.02 37.90" />
        <path d="M12.09 35.11A20 20 0 0 1 15.20 26.15" />
        <path d="M16.87 23.92A20 20 0 0 1 24.60 18.42" />
        <path d="M27.26 17.57A20 20 0 0 1 36.74 17.57" />
        <path d="M39.40 18.42A20 20 0 0 1 47.13 23.92" />
        <path d="M48.80 26.15A20 20 0 0 1 51.91 35.11" />
        <path d="M51.98 37.90A20 20 0 0 1 49.32 47.00" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
