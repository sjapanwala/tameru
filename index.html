<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tameru" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tameru</title>
    <style>
      /* Paints before any script or stylesheet. Matches --bg so there's no flash. */
      html { background: #ffffff; color: #000000; }
      @media (prefers-color-scheme: dark) { html { background: #000000; color: #ffffff; } }
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: inherit; transition: opacity 0.2s ease-out; }
      #splash.splash--out { opacity: 0; pointer-events: none; }
      /* Shown only if loading takes a moment: no fake wait on a fast start. */
      #splash svg { width: 72px; height: 72px; opacity: 0; animation: splash-in 0.25s ease-out 0.4s forwards; }
      /* The app icon's dial: 40 ticks (a dashed circle), lit in the accent as a sweep goes round. */
      #splash .ticks { fill: none; stroke-width: 4.2; stroke-dasharray: 1.2 2.2558; }
      #splash .track { stroke: currentColor; opacity: 0.16; }
      #splash .lit { stroke: #007aff; }
      [data-theme='green'] #splash .lit { stroke: #248a3d; }
      [data-theme='orange'] #splash .lit { stroke: #c93400; }
      @media (prefers-color-scheme: dark) { #splash .lit { stroke: #0a84ff; } [data-theme='green'] #splash .lit { stroke: #30d158; } [data-theme='orange'] #splash .lit { stroke: #ff9f0a; } }
      #splash .sweep { fill: none; stroke: #fff; stroke-width: 8; stroke-dasharray: 74 100; animation: splash-sweep 1.6s ease-in-out infinite; }
      #splash .t { fill: none; stroke: currentColor; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-sweep { 0% { stroke-dasharray: 0 100; } 55% { stroke-dasharray: 74 100; } 100% { stroke-dasharray: 0 100; } }
      @media (prefers-reduced-motion: reduce) { #splash .sweep { animation: none; } }
    </style>
    <script>
      // The chosen theme before the first paint (src/ui/theme.ts keeps this in sync).
      try { var t = localStorage.getItem('tameru-theme'); if (t === 'green' || t === 'orange') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <defs>
          <mask id="splash-sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
            <circle class="sweep" cx="32" cy="32" r="22" pathLength="100" />
          </mask>
        </defs>
        <circle class="ticks track" cx="32" cy="32" r="22" transform="rotate(-91.6 32 32)" />
        <circle class="ticks lit" cx="32" cy="32" r="22" transform="rotate(-91.6 32 32)" mask="url(#splash-sweep)" />
        <path class="t" d="M31.4 21.6V36.3a4.6 4.6 0 0 0 4.6 4.6H37.8M26.2 28.3H37.8" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
